[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "article-loop"
dynamic = ["version"]
description = "Project-local Prime Agent skill scaffold for article-loop"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "article_loop.__version__"}
