version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/.prime/agent/skills/article-loop"
    schedule:
      interval: "weekly"
