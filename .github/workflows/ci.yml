name: CI Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Contract & Architecture Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Syntax & bytecode compilation check
        run: |
          shopt -s nullglob
          files=(scripts/*.py .prime/agent/skills/article-loop/src/article_loop/*.py)
          if [ -d control ]; then
            files+=(control/*.py)
          fi
          python -m py_compile "${files[@]}"

      - name: Run Core Contract Tests
        run: |
          if [ -d control ]; then
            python -m unittest discover -s control -p "test_*.py"
          else
            echo "No control test suite found; skipping."
          fi

      - name: Run Milestone Test Suites
        run: |
          if [ -d control ]; then
            python -m unittest discover -s control -p "test_*.py"
          else
            echo "No control test suite found; skipping."
          fi
