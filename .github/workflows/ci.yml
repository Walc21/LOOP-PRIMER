name: CI Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Compatibility tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Create isolated compatibility venv
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils texlive-latex-base
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Syntax, shell, and JavaScript checks
        run: |
          .venv/bin/python -m py_compile scripts/*.py control/*.py .prime/agent/skills/article-loop/src/article_loop/*.py
          bash -n bin/*.sh
          dash -n bin/bootstrap-deps.sh bin/preflight.sh bin/python-runtime.sh
          node --check .prime/agent/skills/article-loop/src/article_loop/control_center_static/app.js

      - name: Check canonical local runtime policy
        if: matrix.python-version == '3.14'
        run: bin/check.sh

      - name: Run complete M0-M14 regression suite
        run: .venv/bin/python -m unittest discover -s control -p 'test_*.py' -q
