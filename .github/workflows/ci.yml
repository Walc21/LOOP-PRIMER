name: CI Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: M0-M13 Contract & System Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils texlive-latex-base
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Syntax & bytecode compilation check
        run: |
          python -m py_compile scripts/*.py control/*.py .prime/agent/skills/article-loop/src/article_loop/*.py

      - name: Check project-local shell and fail-closed configuration
        run: |
          bash -n bin/check.sh bin/start-prime.sh
          bin/check.sh

      - name: Run complete M0-M13 regression suite
        run: python -m unittest discover -s control -p 'test_*.py' -q
